<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="64" y1="22" x2="64" y2="8" stroke="#90a4ae" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="8" r="6" fill="#ff6f00"/>
  <!-- Feet -->
  <rect x="34" y="108" width="22" height="14" rx="6" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/>
  <rect x="72" y="108" width="22" height="14" rx="6" fill="#cfd8dc" stroke="#37474f" stroke-width="2"/>
  <!-- Body -->
  <rect x="20" y="20" width="88" height="94" rx="24" fill="url(#body)" stroke="#37474f" stroke-width="3"/>
  <!-- Screen -->
  <rect x="28" y="30" width="72" height="64" rx="14" fill="#131722" stroke="#263238" stroke-width="3"/>
  <!-- Eyes -->
  <rect x="40" y="48" width="16" height="22" rx="7" fill="#00e5ff"/>
  <rect x="72" y="48" width="16" height="22" rx="7" fill="#00e5ff"/>
  <circle cx="45" cy="54" r="3" fill="#ffffff"/>
  <circle cx="77" cy="54" r="3" fill="#ffffff"/>
  <!-- Belly button -->
  <rect x="50" y="100" width="28" height="8" rx="4" fill="#ff6f00"/>
</svg>
